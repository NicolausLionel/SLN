    <path d="M690 0L590 400" stroke="#22d3ee" stroke-opacity=".12" stroke-width="1"/>
    <path d="M710 0L610 400" stroke="#8b5cf6" stroke-opacity=".12" stroke-width="1"/>

    <rect x="1" y="1" width="1198" height="398" rx="21" fill="none" stroke="url(#neon)" stroke-opacity=".65"/>
