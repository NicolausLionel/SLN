```svg
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#03030b"/>
    <stop offset=".48" stop-color="#100b29"/>
    <stop offset="1" stop-color="#001b2b"/>
  </linearGradient>

  <linearGradient id="energy">
    <stop stop-color="#8b5cf6">
      <animate attributeName="stop-color" values="#8b5cf6;#00f5ff;#ff38d1;#8b5cf6" dur="3s" repeatCount="indefinite"/>
    </stop>
    <stop offset=".5" stop-color="#00f5ff">
      <animate attributeName="stop-color" values="#00f5ff;#ff38d1;#8b5cf6;#00f5ff" dur="3s" repeatCount="indefinite"/>
    </stop>
    <stop offset="1" stop-color="#ff38d1">
      <animate attributeName="stop-color" values="#ff38d1;#8b5cf6;#00f5ff;#ff38d1" dur="3s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>

  <radialGradient id="core">
    <stop stop-color="#ffffff"/>
    <stop offset=".12" stop-color="#00f5ff"/>
    <stop offset=".4" stop-color="#7138ff" stop-opacity=".8"/>
    <stop offset="1" stop-color="#100b29" stop-opacity="0"/>
  </radialGradient>

  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M28 0H0V28" fill="none" stroke="#6b7cff" stroke-opacity=".15"/>
  </pattern>

  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="12" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <clipPath id="frame">
    <rect width="1200" height="420" rx="18"/>
  </clipPath>
</defs>

<g clip-path="url(#frame)">
  <!-- COSMIC BACKGROUND -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <circle cx="910" cy="205" r="210" fill="#692cff" opacity=".13">
