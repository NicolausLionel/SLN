    <circle cx="1130" cy="330" r="1.5"><animate attributeName="cy" values="330;300;330" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="375" r="1.5"><animate attributeName="opacity" values=".1;1;.1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="370" r="2"><animate attributeName="opacity" values="1;.1;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="315" r="1.5"><animate attributeName="opacity" values=".1;1;.1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="370" r="2"><animate attributeName="opacity" values="1;.1;1" dur="1.9s" repeatCount="indefinite"/></circle>
  </g>

